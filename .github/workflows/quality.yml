name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run unit
      - run: npm run i18n-parity
      - run: npm run portable-os
